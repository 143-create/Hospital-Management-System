<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarePulse Hospital - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="care-auth">
    <div class="container mt-5" style="max-width: 450px;">
        <div class="card shadow border-0 p-4">
            <h3 class="text-center mb-4 text-primary font-weight-bold">Hospital Portal Login</h3>

            <!-- Login Form -->
            <form id="loginForm">
                <div class="mb-3">
                    <label for="identifier" class="form-label">Email Address or Phone</label>
                    <input type="text" id="identifier" class="form-control" placeholder="name@example.com or 017xxxxxxxx" required autocomplete="username">
                </div>
                
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group">
                        <input type="password" id="password" class="form-control" placeholder="Enter your password" required autocomplete="current-password">
                        <button class="btn btn-outline-secondary" type="button" id="togglePasswordBtn">Show</button>
                    </div>
                </div>

                <button type="submit" id="loginBtn" class="btn btn-primary w-100 py-2 font-weight-bold">Login</button>
            </form>

            <div id="responseMessage" class="mt-3 text-center" aria-live="polite"></div>

            <div class="text-center mt-3">
                <small class="text-muted">Don't have an account? <a href="/register" class="text-decoration-none">Register here</a></small>
            </div>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const responseMsg = document.getElementById('responseMessage');
        const passwordInput = document.getElementById('password');
        const togglePasswordBtn = document.getElementById('togglePasswordBtn');

        // Password Show/Hide Toggle
        togglePasswordBtn.addEventListener('click', () => {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            togglePasswordBtn.innerText = isPassword ? 'Hide' : 'Show';
        });

        // Form Submit Handler
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const identifier = document.getElementById('identifier').value.trim();
            const password = passwordInput.value;

            if (!identifier || !password) {
                responseMsg.innerHTML = `<span class="text-danger">Please enter your credentials.</span>`;
                return;
            }

            loginBtn.disabled = true;
            loginBtn.innerText = "Logging in...";
            responseMsg.innerHTML = "";

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: identifier, password: password })
                });

                const data = await response.json();

                if (response.ok) {
                    responseMsg.innerHTML = `<span class="text-success">${escapeHtml(data.message)} Welcome back, ${escapeHtml(data.user.name)}! Redirecting...</span>`;
                    
                    sessionStorage.setItem('userName', data.user.name);
                    sessionStorage.setItem('userRole', data.user.role);

                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 1000);
                } else {
                    let errorHtml = `<span class="text-danger">${escapeHtml(data.message)}</span>`;
                    
                    // Offer direct action if account requires verification
                    if (data.message && data.message.includes('verify your email')) {
                        sessionStorage.setItem('pending_email', identifier);
                        errorHtml += `<br><a href="/register" class="btn btn-link btn-sm mt-2">Go to Verification Step →</a>`;
                    }
                    
                    responseMsg.innerHTML = errorHtml;
                }
            } catch (err) {
                console.error("Login request error:", err);
                responseMsg.innerHTML = `<span class="text-danger">Network error. Please try again.</span>`;
            } finally {
                loginBtn.disabled = false;
                loginBtn.innerText = "Login";
            }
        });

        // XSS Security Utility
        function escapeHtml(str) {
            return String(str || '').replace(/[&<>"']/g, m => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            }[m]));
        }
    </script>
</body>
</html>
