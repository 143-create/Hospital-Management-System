<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Management - Patients</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="care-page">
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand font-weight-bold" href="/">🏥 CarePulse Hospital</a>
            <div class="navbar-nav d-flex align-items-center">
                <a class="nav-link" href="/dashboard">Dashboard</a>
                <a class="nav-link active" href="/patients">Patients</a>
                <a class="nav-link" href="/doctors">Doctors</a>
                <a class="nav-link" href="/prescriptions">Prescriptions</a>
                <a class="nav-link" href="/billing">Billing</a>
                <a class="btn btn-outline-light btn-sm ms-2" href="/logout">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container mb-5">
        <h2 class="mb-4">Patient Management</h2>

        <!-- Patient Registration Form -->
        <div class="card shadow p-4 mb-4 border-0">
            <h4 class="card-title mb-3">Add New Patient</h4>
            <form id="patientForm" class="row g-3">
                <div class="col-md-6">
                    <label for="patientName" class="form-label">Full Name *</label>
                    <input type="text" id="patientName" class="form-control" placeholder="e.g. Jane Doe" required>
                </div>
                <div class="col-md-3">
                    <label for="patientAge" class="form-label">Age *</label>
                    <input type="number" id="patientAge" class="form-control" placeholder="e.g. 35" min="0" max="130" required>
                </div>
                <div class="col-md-3">
                    <label for="patientGender" class="form-label">Gender</label>
                    <select id="patientGender" class="form-select">
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label for="patientDept" class="form-label">Department *</label>
                    <input type="text" id="patientDept" class="form-control" placeholder="e.g. Cardiology, Pediatrics" required>
                </div>
                <div class="col-md-6">
                    <label for="patientPhone" class="form-label">Phone *</label>
                    <input type="tel" id="patientPhone" class="form-control" placeholder="e.g. 017xxxxxxxx" required>
                </div>
                <div class="col-12">
                    <button type="submit" id="savePatientBtn" class="btn btn-primary px-4">Save Patient</button>
                </div>
            </form>
        </div>

        <!-- Patients Directory Card -->
        <div class="card shadow p-4 border-0">
            <div class="row justify-content-between align-items-center mb-3">
                <div class="col-md-4">
                    <h4 class="m-0">Registered Patients</h4>
                </div>
                <div class="col-md-5">
                    <input type="text" id="searchInput" class="form-control" placeholder="Search by name, department, or phone...">
                </div>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Age</th>
                            <th>Gender</th>
                            <th>Department</th>
                            <th>Phone</th>
                        </tr>
                    </thead>
                    <tbody id="patientTableBody">
                        <tr><td colspan="6" class="text-center text-muted py-4">Loading patients...</td></tr>
                    </tbody>
                </table>
            </div>

            <!-- Pagination Controls -->
            <nav class="d-flex justify-content-between align-items-center mt-3">
                <span id="pageInfo" class="text-muted small">Showing 0 of 0 patients</span>
                <ul class="pagination pagination-sm mb-0" id="paginationControls">
                    <!-- Dynamic Buttons -->
                </ul>
            </nav>
        </div>
    </div>

    <script>
        let currentPage = 1;
        const limit = 5;
        let searchDebounceTimer;

        // Fetch patients directly from server using SQL pagination API
        async function fetchPatients(page = 1) {
            currentPage = page;
            const search = document.getElementById('searchInput').value.trim();
            const tbody = document.getElementById('patientTableBody');
            
            try {
                const queryParams = new URLSearchParams({
                    page: currentPage,
                    limit: limit,
                    search: search
                });

                const response = await fetch(`/api/patients?${queryParams.toString()}`);
                if (!response.ok) throw new Error('Failed to load data');
                
                const data = await response.json();
                renderTable(data.patients);
                renderPagination(data.total_records, data.total_pages, data.current_page, data.limit);

            } catch (err) {
                console.error("Error loading patients:", err);
                tbody.innerHTML = `<tr><td colspan="6" class="text-center text-danger py-4">Failed to load patient records.</td></tr>`;
            }
        }

        function renderTable(patients) {
            const tbody = document.getElementById('patientTableBody');
            tbody.innerHTML = '';

            if (!patients || patients.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted py-4">No matching patients found.</td></tr>`;
                return;
            }

            patients.forEach(p => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><span class="badge bg-secondary">#${escapeHtml(p.id)}</span></td>
                    <td class="fw-bold">${escapeHtml(p.name)}</td>
                    <td>${escapeHtml(p.age || 'N/A')}</td>
                    <td>${escapeHtml(p.gender || 'N/A')}</td>
                    <td><span class="badge bg-info text-dark">${escapeHtml(p.department)}</span></td>
                    <td>${escapeHtml(p.phone || 'N/A')}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function renderPagination(totalRecords, totalPages, page, limit) {
            const pageInfo = document.getElementById('pageInfo');
            const paginationEl = document.getElementById('paginationControls');

            const start = totalRecords === 0 ? 0 : (page - 1) * limit + 1;
            const end = Math.min(page * limit, totalRecords);
            pageInfo.innerText = `Showing ${start}-${end} of ${totalRecords} patients`;

            paginationEl.innerHTML = '';
            if (totalPages <= 1) return;

            // Previous Button
            const prevLi = document.createElement('li');
            prevLi.className = `page-item ${page === 1 ? 'disabled' : ''}`;
            prevLi.innerHTML = `<button class="page-link" onclick="fetchPatients(${page - 1})">Previous</button>`;
            paginationEl.appendChild(prevLi);

            // Numeric Buttons
            for (let i = 1; i <= totalPages; i++) {
                const li = document.createElement('li');
                li.className = `page-item ${i === page ? 'active' : ''}`;
                li.innerHTML = `<button class="page-link" onclick="fetchPatients(${i})">${i}</button>`;
                paginationEl.appendChild(li);
            }

            // Next Button
            const nextLi = document.createElement('li');
            nextLi.className = `page-item ${page === totalPages ? 'disabled' : ''}`;
            nextLi.innerHTML = `<button class="page-link" onclick="fetchPatients(${page + 1})">Next</button>`;
            paginationEl.appendChild(nextLi);
        }

        // Handle Add Patient Form Submission
        document.getElementById('patientForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('savePatientBtn');
            
            const payload = {
                name: document.getElementById('patientName').value.trim(),
                age: parseInt(document.getElementById('patientAge').value),
                gender: document.getElementById('patientGender').value,
                department: document.getElementById('patientDept').value.trim(),
                phone: document.getElementById('patientPhone').value.trim()
            };

            submitBtn.disabled = true;
            submitBtn.innerText = "Saving...";

            try {
                const response = await fetch('/api/patients', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                if (response.ok) {
                    document.getElementById('patientForm').reset();
                    fetchPatients(1); // Refresh table to page 1
                } else {
                    alert("Failed to save patient. Check backend server logs.");
                }
            } catch (err) {
                console.error("Error saving patient:", err);
                alert("Network error while adding patient.");
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "Save Patient";
            }
        });

        // Search Input Handler with Debounce
        document.getElementById('searchInput').addEventListener('input', () => {
            clearTimeout(searchDebounceTimer);
            searchDebounceTimer = setTimeout(() => {
                fetchPatients(1);
            }, 300);
        });

        // XSS Prevention Utility
        function escapeHtml(str) {
            return String(str || '').replace(/[&<>"']/g, m => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            }[m]));
        }

        // Initial Load
        document.addEventListener('DOMContentLoaded', () => fetchPatients(1));
    </script>
</body>
</html>
